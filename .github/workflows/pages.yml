name: Build and deploy Quiet Reader

on:
  push:
    branches:
      - main
      - vite-typescript-port
      - redesign/quiet-reader-v2
      - redesign/gateprep-visual-language
      - feature/full-reader-parity
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiet-reader-pages-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate published app version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APP_COMMIT="${GITHUB_SHA::7}"
          APP_SHELL=$(grep -o "quiet-reader-shell-v[0-9]*" service-worker.js | head -1)
          mkdir -p public
          node -e 'const fs=require("fs");const [version,commit,shell]=process.argv.slice(1);fs.writeFileSync("public/version.json",JSON.stringify({version,commit,shell,builtAt:new Date().toISOString()},null,2))' "$APP_VERSION" "$APP_COMMIT" "$APP_SHELL"
          echo "VITE_APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VITE_APP_COMMIT=$APP_COMMIT" >> "$GITHUB_ENV"
          echo "VITE_APP_SHELL=$APP_SHELL" >> "$GITHUB_ENV"
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vite-typescript-port' || github.ref == 'refs/heads/redesign/quiet-reader-v2' || github.ref == 'refs/heads/redesign/gateprep-visual-language' || github.ref == 'refs/heads/feature/full-reader-parity') && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify this is still the latest branch commit
        id: latest
        run: |
          REMOTE_SHA=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF" | awk 'NR==1 {print $1}')
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment for $GITHUB_SHA; branch head is $REMOTE_SHA"
          fi
      - id: deployment
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
